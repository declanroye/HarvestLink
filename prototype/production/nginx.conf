upstream harvestlink_api {
    least_conn;
    server api1:4173 max_fails=3 fail_timeout=10s;
    server api2:4173 max_fails=3 fail_timeout=10s;
    keepalive 16;
}
server {
    listen 80;
    client_max_body_size 1m;
    location / {
        proxy_pass http://harvestlink_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Never replay a POST on another upstream after an ambiguous response.
        proxy_next_upstream off;
    }
}
